[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datavaluebench"
version = "0.1.0"
description = "Dataset evaluation across performance, retrieval, alternatives, and contribution settings"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yang Yang"}, {name = "Edward Curry"}]
dependencies = ["numpy==1.26.4", "pandas==2.2.2", "scipy==1.15.3", "pyarrow==15.0.2", "scikit-learn==1.7.2", "numba==0.61.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
